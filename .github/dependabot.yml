version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    ignore:
      # x/sync v0.23.0 requires Go 1.26; keep Go 1.25 support until a planned upgrade.
      - dependency-name: "golang.org/x/sync"
        versions: [">=0.23.0"]
    groups:
      all:
        patterns:
          - "*"
